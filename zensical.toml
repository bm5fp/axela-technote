[project]

# site_name はページヘッダーとブラウザのウィンドウタイトルに表示されます。
site_name = "AXELA Tech Note"

# site_description は HTML の head に含まれ、検索エンジン向けにサイト内容を説明する文章を設定します。
site_description = "A new project generated from the default template project."

# site_author 属性です。HTML の head 要素に使用されます。
site_author = "AXELA"

# site_url はサイトの正規 URL です。オンラインドキュメントを構築する場合は設定してください。
#site_url = "https://www.example.com/"

# copyright はページフッターに表示され、HTML フラグメントを含めることができます。
copyright = """
© 2026 AXELA. All rights reserved.
"""

# Zensical は暗黙的なナビゲーションと明示的なナビゲーションの両方をサポートします。
# ここでナビゲーションを定義しない場合、Zensical は "docs_dir" のディレクトリ構造からナビゲーション構造を自動生成します。
# 以下の定義は TOML 構文でナビゲーション構造を定義する例です。
#
# nav = [
#   { "Get started" = "index.md" },
#   { "Markdown in 5min" = "markdown.md" },
# ]

# "extra_css" オプションでは独自の CSS スタイルを追加してZensical プロジェクトをカスタマイズできます。任意の数の CSS ファイルを追加できます。
# パスは "docs_dir" からの相対パスで指定します。
#
extra_css = ["zensical-stylesheets/lightbox.css"]

# "extra_javascript" オプションでは独自の JavaScript を追加してプロジェクトの動作をカスタマイズできます。
# パスは "docs_dir" からの相対パスで指定します。
#
extra_javascript = ["zensical-javascripts/lightbox.js"]

# ----------------------------------------------------------------------------
# テーマオプションの設定セクション
# ----------------------------------------------------------------------------
[project.theme]

# "classic" に変更すると、従来の Material for MkDocs の外観になります。
#variant = "classic"

# Zensical では特定のブロック、パーシャル、テンプレート全体をオーバーライドしたり、独自のテンプレートを定義したりできます。
# 設定するには下の custom_dir を有効にして、テンプレートを保存するディレクトリを指定します。
#custom_dir = "overrides"

# "favicon" オプションでブラウザのタブやタイトルバーに表示する
# アイコン画像を設定できます。パスは "docs_dir" からの相対パスで指定します。
favicon = "zensical-assets/axela_icon_circle.png"

# Zensical は 60 以上の言語をサポートしています。
# Zensical のテンプレートが生成するラベルやツールチップが翻訳されます。"language" オプションで使用言語を設定します。
# この言語は HTML の head 要素にも示され、アクセシビリティや検索エンジン・翻訳ツールの案内に役立ちます。
language = "ja"

# Zensical はドキュメントサイトの動作を変更する機能トグルを多数提供します。
features = [
    # Zensical にはアナウンスバーが含まれています。この機能を有効にすると、ユーザーが読んだ後にバーを閉じられるようになります。
    "announce.dismiss",

    # リポジトリを設定してこの機能を有効にすると、Zensical はページに編集ボタンを生成します。主要なリポジトリホスティングサービスに対応しています。
    #"content.action.edit",

    # リポジトリを設定してこの機能を有効にすると、現在のページのMarkdownコードを表示するボタンが生成されます。
    #"content.action.view",

    # コードアノテーションを使うと、コードブロック内の重要な箇所にツールチップ付きアイコンを追加して説明を提供できます。
    "content.code.annotate",

    # この機能を有効にすると、コードブロックにコピーボタンが表示され、選択せずにクリップボードへコピーできます。
    "content.code.copy",

    # コードブロックで行範囲を選択できるボタンを追加します。
    "content.code.select",

    # 脚注をインラインツールチップとして表示し、ページを離れずに脚注を読めるようにします。
    "content.footnote.tooltips",

    # 同じタイトル（例：「Python」「JavaScript」「Cobol」）のコンテンツタブが多数ある場合、この機能を有効にすると1つを選ぶと他もすべて切り替わります。
    "content.tabs.link",

    # この機能を有効にすると、マウスオーバー時にツールチップを表示するリンクを作成できます。
    "content.tooltips",

    # この機能を有効にすると、ユーザーが一定以上スクロールした際にヘッダーが自動的に非表示になります。
    # "header.autohide",

    # この機能を有効にすると、ナビゲーションサイドバーの折りたたみセクションがデフォルトですべて展開されます。
    #"navigation.expand",

    # フッターにナビゲーション要素を追加し、次のページや前のページへ移動できるようにします。
    "navigation.footer",

    # セクションインデックスページを有効にすると、ドキュメントをセクションに直接紐付けられます。概要ページの提供に特に便利です。
    "navigation.indexes",

    # インスタントナビゲーションを有効にすると、内部リンクのクリックがXHR で処理され、ページ全体を再読み込みせずに遷移します。
    "navigation.instant",

    # インスタントプリフェッチを有効にすると、リンクにマウスを乗せた時点でページの取得を開始し、ユーザーが感じる読み込み時間を短縮します。
    "navigation.instant.prefetch",

    # 低速接続でインスタントナビゲーションを使用する際のユーザー体験向上のため、プログレスインジケーターを有効にできます。
    #"navigation.instant.progress",

    # ナビゲーションパスを有効にすると、各ページのタイトル上にパンくずナビゲーションが表示されます。
    "navigation.path",

    # プルーニングを有効にすると、表示中のナビゲーション項目のみをHTMLに含めることで、ビルドサイズを 33% 以上削減できます。
    #"navigation.prune",

    # セクションを有効にすると、1220px 以上の画面幅でトップレベルセクションがサイドバーにグループとして表示されます（モバイルではそのまま）。
    #"navigation.sections",

    # タブを有効にすると、1220px 以上の画面幅でトップレベルセクションがヘッダー下のメニュー層に表示されます（モバイルではそのまま）。
    #"navigation.tabs",

    # スティッキータブを有効にすると、ナビゲーションタブがヘッダー下に固定され、スクロールしても常に表示されます。
    #"navigation.tabs.sticky",

    # トップへ戻るボタンを表示します。ユーザーが下にスクロールした後、上にスクロールし始めたときに表示されます。
    "navigation.top",

    # アンカートラッキングを有効にすると、目次でハイライトされているアンカーがアドレスバーの URL に自動的に反映されます。
    "navigation.tracking",

    # 検索ハイライトを有効にすると、検索結果をクリックした際にリンク先ページの一致箇所がすべてハイライトされます。
    "search.highlight",

    # 目次のアンカーフォローを有効にすると、アクティブなアンカーが常に見えるようにサイドバーが自動スクロールします。
    # "toc.follow",

    # 目次のナビゲーション統合を有効にすると、目次が常に左のナビゲーションサイドバーの一部として表示されます。
    #"toc.integrate",
]

# ----------------------------------------------------------------------------
# "theme" サブセクションの "logo" オプションで、ヘッダーに表示する独自ロゴを設定できます。"docs_dir" からの相対パスで指定します。
# 例: docs/assets/logo.png を使用する場合は以下のように設定します:
# ----------------------------------------------------------------------------
logo = "zensical-assets/axela_logo_plain.svg"

# ----------------------------------------------------------------------------
# 専用のプロジェクトロゴがない場合、Zensical に同梱されたアイコンセットから組み込みアイコンを使用できます。この設定は別のサブセクションにあり、
# 上記の logo 設定が優先されます。
# ----------------------------------------------------------------------------
#[project.theme.icon]
#logo = "lucide/smile"

# ----------------------------------------------------------------------------
# "font" サブセクションでフォントを設定できます。デフォルトではGoogle Fonts から読み込まれ、適切なライセンスのフォントを幅広く選べます。
# 通常テキスト用フォントとコードブロック用等幅フォントを設定できます。
# ----------------------------------------------------------------------------
#[project.theme.font]
#text = "M PLUS 1p"
#code = "Jetbrains Mono"

# ----------------------------------------------------------------------------
# "palette" サブセクションでカラースキームを設定できます。ダークモードなど複数のカラースキームを設定してユーザーが切り替えられるようにできます。
# 各カラースキームはさらにカスタマイズ可能です。
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# "extra" セクションにはその他の設定が含まれます。
# ----------------------------------------------------------------------------
#[[project.extra.social]]
#icon = "fontawesome/brands/github"
#link = "https://github.com/user/repo"
